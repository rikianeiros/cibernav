{% extends "base.html" %}

{% block content %}
<h2>Escaneo en Curso</h2>
<p>El análisis de red se está ejecutando en segundo plano. Esta página se actualizará automáticamente cuando termine.</p>

<div class="card" id="status-card">
    <p id="status-text">⏳ Escaneando la red... Esto puede tardar varios minutos dependiendo del tamaño de la red.</p>
</div>

<script>
    const jobId = "{{ job_id }}";

    function comprobarEstado() {
        fetch('/api/estado/' + jobId)
            .then(res => res.json())
            .then(data => {
                if (data.estado === 'completado') {
                    document.getElementById('status-text').textContent = '✅ ¡Escaneo completado! Redirigiendo...';
                    window.location.href = '/escaneo/' + data.escaneo_id;
                } else if (data.estado === 'error') {
                    document.getElementById('status-text').textContent = '❌ Error: ' + data.error;
                } else {
                    // Seguir comprobando cada 5 segundos
                    setTimeout(comprobarEstado, 5000);
                }
            })
            .catch(() => setTimeout(comprobarEstado, 5000));
    }

    // Primera comprobación a los 5 segundos
    setTimeout(comprobarEstado, 5000);
</script>
{% endblock %}
